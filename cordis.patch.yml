# dsh-web-research bundle patch.
#
# Row resolution: the plugin entry uses an absolute file URL so the live host
# picks up a fresh module generation on remove+install without a restart (the
# in-process module cache is keyed by URL). The `?vN` query is a generation
# bump: change it whenever main.js changes so the host re-imports the file
# (Node keeps one ESM cache entry per URL). If the workspace moves, update the
# path here.
#
# Backend settings are deliberately NOT baked into the row config: they come
# from the `.env` file next to this bundle (see .env.example) through the
# WEBRESEARCH_* / CAMOFOX_* contract the plugin loads into the pipeline's
# environment (precedence per field: row `config` > process env > `.env` >
# Python default). The two values kept here are behavior flags, not secrets.
#
# `registerWebBackend: true` registers the seam providers (web-research-search /
# web-research-extract) into the `web` service, so the built-in web_search /
# web_fetch tools can be routed to the local cache-backed pipeline by selecting
# them in the web row config (the profile layer currently selects the searxng
# provider for search).
- insert:
    - id: web-research
      name: 'file:///home/user1/dhs-web-research/main.js?v2'
      config:
        label: web-research
        registerWebBackend: true
